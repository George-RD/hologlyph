ignore:
- dist
- demo
- vite.config.ts
- vitest.config.ts
targets:
- language: typescript
  node: hologlyph.asset.loader
  path: ./assets
gates:
- name: typecheck
  command: bunx tsc --noEmit
- name: test
  command: bunx vitest run
- name: lint
  command: bun run lint
- name: build
  command: bun run build
