name: Apply verified mouth edit
on:
  pull_request:
    paths: ['.github/workflows/mouth-apply-edit.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.number == 96 && github.head_ref == 'feat/coherent-mouth-materials' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact locally verified rendering patch and remove transfer helpers
        run: |
          echo '195e5c9ecbfdccb66599f47d22ad8eefb0c67e1c9bfe4cf1b80a8e17615705bd  tools/review/mouth-edit.patch' | sha256sum --check
          git apply --check --index tools/review/mouth-edit.patch
          git apply --index tools/review/mouth-edit.patch
          git rm tools/review/mouth-edit.patch .github/workflows/mouth-apply-edit.yml .github/workflows/mouth-dev-tools.yml
          git diff --cached --stat
          git config user.name 'George'
          git config user.email '180932462+George-RD@users.noreply.github.com'
          git commit -m 'feat(mouth): use a subdued shared glyph surface for oral anatomy'
          git push origin HEAD:refs/heads/feat/coherent-mouth-materials
