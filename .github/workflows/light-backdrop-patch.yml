name: Light backdrop contour patch

on:
  push:
    branches: [fix/light-backdrop-glyph-contour]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      - name: Add regression first
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('test/shaders.test.ts')
          text = path.read_text()
          old = """    expect(thickness, 'aThickness reaches the front opacity').toBeDefined();

    // Absorption is the half of the feature that cannot be seen in the
"""
          new = """    expect(thickness, 'aThickness reaches the front opacity').toBeDefined();
    // Bright-backdrop adaptation must reach alpha, not only colour. Otherwise
    // Beer-Lambert thickness keeps painting a grey shell behind the glyphs.
    expect(reachesNode(front.opacityNode, uniforms.inkMix)).toBe(true);

    // Absorption is the half of the feature that cannot be seen in the
"""
          if text.count(old) != 1:
              raise SystemExit(f'regression anchor count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new))
          PY

      - name: Prove regression catches current shader
        run: |
          if bunx vitest run test/shaders.test.ts -t "wires the baked thickness into both Beer-Lambert terminals"; then
            echo "Regression unexpectedly passed before implementation"
            exit 1
          fi

      - name: Route bright backdrop coverage through glyphs
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/shaders/materials.ts')
          text = path.read_text()
          old = """  const zoneBoost = lipM.mul(uLipsOp)
    .add(aNose.mul(uNoseOp))
    .add(aJaw.mul(uJawOp))
    .add(aEyelid.mul(uOrbitOp))
    .add(browM.mul(uBrowOp));
  // Beer-Lambert: thicker body transmits less of the page behind it, so the
  // cranium reads as a block while the nose and chin stay clear.
  const bodyOpacity = float(1)
    .sub(exp(aThickness.mul(GLASS_ABSORPTION).negate()))
    .mul(uGlassAmount);
  // The pre-glass alpha, kept in exactly the order and shape it had before
  // this change so the GPU evaluates the same instruction sequence and
  // `glass.amount = 0` reproduces the approved look bit for bit.
  const baseAlpha = luma.mul(float(1).sub(uBaseOpacity)).add(uBaseOpacity)
    .add(zoneBoost)
    .add(socket.mul(uSocketMask));
  // What the body newly hides, as a share of the pixel. The front glyphs keep
  // their own alpha; this is the extra coverage the thickness buys. The
  // saturate is what stops the additive zone boosts driving it negative.
  const bodyShare = bodyOpacity.mul(float(1).sub(baseAlpha.saturate()));
  const totalAlpha = baseAlpha
    // Glass thickens towards the silhouette, which also stops the back of the
    // head reading through at grazing angles. The waterline fade rides on the
    // glass terms only: the base glyph alpha is left alone so the face does
    // not dissolve, only the shell's own volume does.
    .add(glassFresnel.mul(uFresnel).mul(waterFadeMix))
    // Mid-tone pages give neither glow nor ink much contrast; lift the floor.
    .add(uOpacityFloor)
    .add(bodyShare.mul(waterFadeMix))
    .clamp(0, 1);
"""
          new = """  const zoneBoost = lipM.mul(uLipsOp)
    .add(aNose.mul(uNoseOp))
    .add(aJaw.mul(uJawOp))
    .add(aEyelid.mul(uOrbitOp))
    .add(browM.mul(uBrowOp));
  // Beer-Lambert: thicker body transmits less of the page behind it. On the
  // approved dark page that can spend alpha across the surface; on a bright
  // page the same signal must strengthen glyphs instead of exposing a grey
  // shaded mesh beneath them.
  const bodyOpacity = float(1)
    .sub(exp(aThickness.mul(GLASS_ABSORPTION).negate()))
    .mul(uGlassAmount);
  // Keep the approved dark-page alpha expression intact as one side of the
  // backdrop mix. The bright-page side has no surface floor: regional feature
  // boosts make sampled letters more present, while gaps stay transparent.
  const surfaceAlpha = luma.mul(float(1).sub(uBaseOpacity)).add(uBaseOpacity)
    .add(zoneBoost)
    .add(socket.mul(uSocketMask));
  const glyphAlpha = luma
    .add(zoneBoost.mul(luma))
    .add(socket.mul(uSocketMask).mul(luma));
  const baseAlpha = mix(surfaceAlpha, glyphAlpha, uInkMix);
  // The same backdrop mix routes every contour-bearing alpha term. At inkMix
  // 0 this is the existing glass surface. At inkMix 1, thickness, Fresnel and
  // mid-tone reinforcement can only increase coverage where a glyph exists.
  const adaptiveCoverage = mix(float(1), luma, uInkMix);
  const surfaceBodyShare = bodyOpacity.mul(float(1).sub(baseAlpha.saturate()));
  const glyphBodyShare = surfaceBodyShare.mul(luma);
  const bodyShare = mix(surfaceBodyShare, glyphBodyShare, uInkMix);
  const totalAlpha = baseAlpha
    // Glass thickens towards the silhouette, which also stops the back of the
    // head reading through at grazing angles. The waterline fade rides on the
    // glass terms only: the base glyph alpha is left alone so the face does
    // not dissolve, only the shell's own volume does.
    .add(glassFresnel.mul(uFresnel).mul(waterFadeMix).mul(adaptiveCoverage))
    // Mid-tone pages need more contrast, but spend it on glyph coverage rather
    // than laying an opacity wash over the host page.
    .add(uOpacityFloor.mul(adaptiveCoverage))
    .add(bodyShare.mul(waterFadeMix))
    .clamp(0, 1);
"""
          if text.count(old) != 1:
              raise SystemExit(f'material anchor count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new))

          path = Path('src/shaders/glass.ts')
          text = path.read_text()
          replacements = {
              '/** Extra base opacity, peaking on mid tones where contrast is worst. */':
                  '/** Extra glyph-opacity reinforcement, peaking on mid tones where contrast is worst. */',
              '/** Peak opacity added on a mid-tone backdrop. */':
                  '/** Peak glyph-opacity reinforcement on a mid-tone backdrop. */',
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f'glass comment anchor count was {text.count(before)}, expected 1: {before}')
              text = text.replace(before, after)
          path.write_text(text)
          PY

      - name: Focused shader verification
        run: |
          bunx vitest run test/shaders.test.ts test/shaders-glass.test.ts
          bunx tsc --noEmit

      - run: bunx playwright install --with-deps chromium
      - name: Start demo
        run: |
          bun run dev > /tmp/hologlyph-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/hologlyph/engine.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/hologlyph-dev.log
          exit 1
      - name: Capture backdrop variants
        run: bun tools/smoke/backdrop-shot.mjs http://localhost:5173/hologlyph/engine.html tools/smoke/out-light-backdrop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: light-backdrop-review
          path: tools/smoke/out-light-backdrop/

      - name: Record verified slice
        run: |
          cat > meta/changes/2026-09-15-light-backdrop-glyph-contour/tasks.md <<'EOF'
          # Tasks

          - [x] Add a regression proving backdrop adaptation participates in front-surface alpha.
          - [x] Keep the approved dark-background alpha path unchanged.
          - [x] Route bright-background feature emphasis and thickness into glyph coverage instead of solid surface coverage.
          - [x] Keep the glass edge, interior depth and live backdrop controls working across dark, mid and light themes.
          - [x] Run focused shader tests, type-check and the backdrop browser smoke.
          - [ ] Run the full repository CI and visual evaluation before merge.
          EOF
          cat >> meta/changes/2026-09-15-light-backdrop-glyph-contour/implementation-notes.md <<EOF

          ## Focused verification

          GitHub Actions run ${GITHUB_RUN_ID} proved the new regression fails against the old alpha graph, then passed the focused shader tests and strict TypeScript check after the implementation. The existing backdrop browser smoke passed and captured dark, mid, light and brand variants for visual review.
          EOF

      - name: Commit verified patch
        run: |
          rm .github/workflows/light-backdrop-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(shaders): route light backdrop contour through glyphs"
          git push origin HEAD:fix/light-backdrop-glyph-contour
