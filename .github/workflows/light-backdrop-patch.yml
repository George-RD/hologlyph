name: Light backdrop contour patch

on:
  push:
    branches:
      - fix/light-backdrop-glyph-contour

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      - name: Add regression first
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path
          path = Path('test/shaders.test.ts')
          text = path.read_text()
          old = base64.b64decode('ICAgIGV4cGVjdCh0aGlja25lc3MsICdhVGhpY2tuZXNzIHJlYWNoZXMgdGhlIGZyb250IG9wYWNpdHknKS50b0JlRGVmaW5lZCgpOwoKICAgIC8vIEFic29ycHRpb24gaXMgdGhlIGhhbGYgb2YgdGhlIGZlYXR1cmUgdGhhdCBjYW5ub3QgYmUgc2VlbiBpbiB0aGUK').decode()
          new = base64.b64decode('').decode()
          if text.count(old) != 1:
              raise SystemExit(f'regression anchor count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new))
          PY

      - name: Prove regression catches current shader
        run: |
          if bunx vitest run test/shaders.test.ts -t "wires the baked thickness into both Beer-Lambert terminals"; then
            echo "Regression unexpectedly passed before implementation"
            exit 1
          fi

      - name: Route bright backdrop coverage through glyphs
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path
          path = Path('src/shaders/materials.ts')
          text = path.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if text.count(old) != 1:
              raise SystemExit(f'material anchor count was {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new))

          path = Path('src/shaders/glass.ts')
          text = path.read_text()
          before = '/** Extra base opacity, peaking on mid tones where contrast is worst. */'
          after = '/** Extra glyph-opacity reinforcement, peaking on mid tones where contrast is worst. */'
          if text.count(before) != 1:
              raise SystemExit('missing BackdropAdaptation opacity comment')
          text = text.replace(before, after)
          before = '/** Peak opacity added on a mid-tone backdrop. */'
          after = '/** Peak glyph-opacity reinforcement on a mid-tone backdrop. */'
          if text.count(before) != 1:
              raise SystemExit('missing MID_OPACITY_MAX comment')
          path.write_text(text.replace(before, after))
          PY

      - name: Focused shader verification
        run: |
          bunx vitest run test/shaders.test.ts test/shaders-glass.test.ts
          bunx tsc --noEmit

      - run: bunx playwright install --with-deps chromium
      - name: Start demo
        run: |
          bun run dev > /tmp/hologlyph-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/hologlyph/engine.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/hologlyph-dev.log
          exit 1
      - name: Capture backdrop variants
        run: bun tools/smoke/backdrop-shot.mjs http://localhost:5173/hologlyph/engine.html tools/smoke/out-light-backdrop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: light-backdrop-review
          path: tools/smoke/out-light-backdrop/

      - name: Commit verified patch
        run: |
          rm .github/workflows/light-backdrop-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(shaders): route light backdrop contour through glyphs"
          git push origin HEAD:fix/light-backdrop-glyph-contour
