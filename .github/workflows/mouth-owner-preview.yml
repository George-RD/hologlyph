name: Mouth owner preview
on:
  pull_request:
    paths: ['.github/workflows/mouth-owner-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: |
          bun run dev &
          for i in $(seq 1 60); do curl -sf http://localhost:5173/hologlyph/engine.html >/dev/null && break; sleep 1; done
      - run: bun tools/smoke/mouth-owner-preview.mjs http://localhost:5173/hologlyph/engine.html
      - uses: actions/upload-artifact@v4
        with:
          name: mouth-owner-preview
          path: tools/evals/out/mouth-owner-preview/
          retention-days: 7
