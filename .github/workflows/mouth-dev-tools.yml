name: Mouth isolated toolchain
on:
  pull_request:
    paths: ['.github/workflows/mouth-dev-tools.yml']
permissions:
  contents: read
jobs:
  dependencies:
    if: github.head_ref == 'feat/coherent-mouth-materials' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: tar -czf /tmp/hologlyph-review-deps.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: mouth-local-deps
          path: /tmp/hologlyph-review-deps.tgz
          retention-days: 1
