<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>hologlyph</title>
    <link rel="stylesheet" href="./showcase.css" />
  </head>
  <body>
    <main id="stage" aria-label="Interactive Hologlyph head">
      <canvas id="holo"></canvas>
    </main>

    <header class="chrome top-chrome">
      <div class="wordmark" aria-label="Hologlyph">
        <strong>hologlyph</strong>
        <span>talking head playground</span>
      </div>
      <button
        id="settingsTrigger"
        class="icon-button"
        type="button"
        aria-label="Open studio controls"
        aria-controls="settingsPanel"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Z" />
          <path d="M19.2 13.1c.05-.36.05-.74 0-1.1l2.02-1.58-1.9-3.28-2.38.96a8.1 8.1 0 0 0-.95-.55L15.64 5h-3.79l-.36 2.55c-.33.16-.65.34-.95.55l-2.38-.96-1.9 3.28L8.28 12c-.05.36-.05.74 0 1.1l-2.02 1.58 1.9 3.28 2.38-.96c.3.21.62.39.95.55l.36 2.55h3.79l.35-2.55c.34-.16.66-.34.96-.55l2.38.96 1.9-3.28-2.03-1.58Z" />
        </svg>
      </button>
    </header>

    <p id="interactionHint" class="interaction-hint">Drag to turn the head</p>

    <div id="captionBubble" class="caption-bubble" aria-live="polite" aria-atomic="true">
      <span id="captionText"></span>
    </div>

    <div id="expressionMenu" class="expression-menu" role="group" aria-label="Choose an expression"></div>

    <section
      id="captionPanel"
      class="caption-panel"
      aria-label="Choose something for Hologlyph to say"
      aria-hidden="true"
    >
      <div class="panel-heading">
        <div>
          <p class="eyebrow">sample speech</p>
          <h2>Choose a line</h2>
        </div>
        <button id="closeCaptions" class="small-close" type="button" aria-label="Close sample speech">×</button>
      </div>
      <div id="captionList" class="caption-list"></div>
    </section>

    <nav class="chrome command-dock" aria-label="Hologlyph controls">
      <button
        id="expressionTrigger"
        class="dock-button"
        type="button"
        aria-label="Choose expression"
        aria-controls="expressionMenu"
        aria-expanded="false"
        data-expression="friendly"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.25" />
          <path d="M8.6 10h.01M15.4 10h.01M8.5 14.1c1.85 1.55 5.15 1.55 7 0" />
        </svg>
        <span>mood</span>
      </button>

      <button id="speakTrigger" class="dock-button primary" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.5 10.25v3.5M9.25 7.75v8.5M13 5.5v13M16.75 8v8M20.5 10.25v3.5" />
        </svg>
        <span>say</span>
      </button>

      <button
        id="captionTrigger"
        class="dock-button"
        type="button"
        aria-label="Choose sample speech"
        aria-controls="captionPanel"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.25 5.75h13.5v9.5H11l-4.75 3v-3h-1V5.75Z" />
          <path d="M8.25 9.2h7.5M8.25 12h5" />
        </svg>
        <span>lines</span>
      </button>
    </nav>

    <button id="settingsScrim" class="settings-scrim" type="button" tabindex="-1" aria-label="Close studio controls"></button>

    <aside id="settingsPanel" class="settings-panel" aria-hidden="true" aria-label="Studio controls">
      <div class="settings-heading">
        <div>
          <p class="eyebrow">hologlyph studio</p>
          <h2>Live look</h2>
        </div>
        <button id="closeSettings" class="small-close" type="button" aria-label="Close studio controls">×</button>
      </div>

      <div class="settings-body">
        <section class="settings-group">
          <div class="settings-label">
            <span>Backdrop</span>
            <output id="backdropValue">#05070d</output>
          </div>
          <div id="backdropSwatches" class="swatches" aria-label="Backdrop presets"></div>
        </section>

        <section class="settings-group">
          <label class="settings-label" for="glassAmount">
            <span>Glass</span>
            <output id="glassAmountValue" for="glassAmount"></output>
          </label>
          <input id="glassAmount" type="range" min="0" max="1" step="0.01" />

          <label class="settings-label" for="presence">
            <span>Presence</span>
            <output id="presenceValue" for="presence"></output>
          </label>
          <input id="presence" type="range" min="0" max="1" step="0.005" />

          <label class="colour-control" for="glassTint">
            <span>Glass tint</span>
            <input id="glassTint" type="color" />
          </label>
        </section>

        <section class="settings-group">
          <label class="settings-label" for="toneBalance">
            <span>Ink balance</span>
            <output id="toneBalanceValue" for="toneBalance"></output>
          </label>
          <input id="toneBalance" type="range" min="0" max="1" step="0.01" />

          <label class="settings-label" for="warmth">
            <span>Warmth</span>
            <output id="warmthValue" for="warmth"></output>
          </label>
          <input id="warmth" type="range" min="0" max="1" step="0.01" />

          <label class="settings-label" for="rim">
            <span>Rim</span>
            <output id="rimValue" for="rim"></output>
          </label>
          <input id="rim" type="range" min="0" max="0.5" step="0.005" />
        </section>

        <label class="toggle-row" for="reducedMotion">
          <span>
            <strong>Reduced motion</strong>
            <small>Damps nods and disables saccades</small>
          </span>
          <input id="reducedMotion" type="checkbox" />
        </label>
      </div>

      <div class="settings-footer">
        <a href="./studio.html">Open all studio controls</a>
        <a href="https://github.com/George-RD/hologlyph">GitHub</a>
      </div>
    </aside>

    <div id="statusToast" class="status-toast" role="status" aria-live="polite"></div>

    <script type="module" src="./showcase.ts"></script>
  </body>
</html>
