<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hologlyph studio</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: #080d18;
        --line: #1d2740;
        --fg: #e6ecff;
        --dim: #8c9ab8;
        --accent: #6cc6ff;
        --warn: #ffd479;
        --bad: #ff8f9c;
        --rail: 23rem;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        color: var(--fg);
        font: 13px/1.55 system-ui, sans-serif;
        /* The stage colour is the page colour: the head is transparent, so a
           backdrop is not decoration, it is what you judge the glass against. */
        background: #05070d;
      }

      /* Render only the usable stage, otherwise the head centres beneath the rail. */
      #stage {
        position: fixed;
        inset: 0;
        transition: left 0.22s ease;
      }
      body.rail-visible #stage { left: var(--rail); }
      /* Desktop begins with the rail geometry before module boot. Narrow
         layouts remain collapsed until the rail controller has initialised. */
      @media (max-width: 760px) {
        body.rail-visible:not(.rail-ready) #stage { left: 0; }
        body.rail-visible:not(.rail-ready) #rail { transform: translateX(calc(-1 * var(--rail))); }
      }
      #holo {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      /* --- rail ------------------------------------------------------- */
      #rail {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--rail);
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--panel);
        transition: transform 0.22s ease;
        z-index: 3;
      }
      #rail { transform: translateX(calc(-1 * var(--rail))); }
      body.rail-visible #rail { transform: none; }

      #railHead { padding: 0.85rem 1rem 0.6rem; border-bottom: 1px solid var(--line); }
      #railHead h1 { font-size: 0.95rem; margin: 0; }
      #railHead p { margin: 0.1rem 0 0; font-size: 0.72rem; color: var(--dim); }
      #railBody { flex: 1; overflow-y: auto; padding: 0.5rem 0.75rem 3rem; }

      /* --- progressive disclosure -------------------------------------- */
      details.group {
        border: 1px solid var(--line);
        border-radius: 0.45rem;
        margin-bottom: 0.45rem;
        background: rgba(255, 255, 255, 0.015);
      }
      details.group > summary {
        cursor: pointer;
        padding: 0.45rem 0.65rem;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      details.group > summary::-webkit-details-marker { display: none; }
      details.group > summary::before {
        content: '▸';
        color: var(--dim);
        font-size: 0.7rem;
        transition: transform 0.15s;
      }
      details.group[open] > summary::before { transform: rotate(90deg); }
      details.group > summary .note {
        margin-left: auto;
        font-weight: 400;
        font-size: 0.68rem;
        color: var(--dim);
      }
      details.group > .body { padding: 0.1rem 0.65rem 0.6rem; }

      details.tier { border-color: transparent; background: none; margin-bottom: 0.2rem; }
      details.tier > summary {
        color: var(--dim);
        text-transform: uppercase;
        font-size: 0.68rem;
        letter-spacing: 0.09em;
        padding: 0.7rem 0.3rem 0.3rem;
      }
      details.tier > .body { padding: 0 0 0.4rem; }
      details.tier.dev > summary { color: var(--warn); }
      details.tier.legacy > summary { color: var(--bad); }
      details.tier.notes > summary { color: var(--accent); }
      /* Prose, not a control. Wider measure than a slider row and left aligned
         with the group body rather than the label column. */
      .noteText {
        font-size: 0.74rem;
        color: var(--dim);
        margin: 0.15rem 0 0.35rem;
      }

      .tierNote {
        font-size: 0.7rem;
        color: var(--dim);
        margin: 0 0.3rem 0.5rem;
        padding-left: 0.55rem;
        border-left: 2px solid var(--line);
      }

      /* --- controls ---------------------------------------------------- */
      .row {
        display: grid;
        grid-template-columns: 1fr 2fr auto;
        gap: 0.4rem;
        align-items: center;
        margin: 0.18rem 0;
      }
      .row > label { font-size: 0.76rem; color: var(--fg); }
      .row > label.off { color: var(--dim); }
      .row output {
        font-variant-numeric: tabular-nums;
        font-size: 0.7rem;
        color: var(--dim);
        min-width: 3rem;
        text-align: right;
      }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      input[type='color'] {
        width: 100%;
        height: 1.35rem;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 0.25rem;
        background: none;
      }
      .row.check { grid-template-columns: auto 1fr; }
      .row.check input { accent-color: var(--accent); }

      .btns { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.4rem 0 0.1rem; }
      button {
        font: inherit;
        font-size: 0.74rem;
        padding: 0.28rem 0.55rem;
        border-radius: 0.3rem;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--fg);
        cursor: pointer;
      }
      .swatches button.active { outline: 2px solid var(--accent); outline-offset: 2px; }
      button:hover { border-color: var(--accent); }
      button.on { border-color: var(--accent); background: rgba(108, 198, 255, 0.16); }

      .swatches { display: flex; gap: 0.25rem; flex-wrap: wrap; margin: 0.35rem 0 0.15rem; }
      .swatches button {
        width: 1.5rem;
        height: 1.5rem;
        padding: 0;
        border-radius: 0.25rem;
      }

      /* --- focus toggle ------------------------------------------------ */
      /* This chip floats over the stage, so it cannot inherit the rail's
         contrast: on a light backdrop a near-white button on near-white page
         disappears. It carries its own dark ground. */
      #focus {
        position: fixed;
        top: 0.6rem;
        left: calc(var(--rail) + 0.6rem);
        z-index: 4;
        transition: left 0.22s ease;
        background: rgba(8, 13, 24, 0.82);
        border-color: rgba(230, 236, 255, 0.28);
        color: #e6ecff;
        backdrop-filter: blur(6px);
      }
      body:not(.rail-visible) #focus { left: 0.6rem; }
      #saybar {
        position: fixed;
        top: 3.35rem;
        left: calc(var(--rail) + 0.6rem);
        z-index: 4;
        display: flex;
        max-width: min(26rem, calc(100vw - 1.2rem));
        transition: left 0.22s ease;
      }
      #saybar input {
        min-width: 0;
        flex: 1;
        padding: 0.28rem 0.55rem;
        border: 1px solid rgba(230, 236, 255, 0.28);
        border-radius: 0.3rem 0 0 0.3rem;
        background: rgba(8, 13, 24, 0.82);
        color: #e6ecff;
        font: inherit;
      }
      #saybar button {
        border-radius: 0 0.3rem 0.3rem 0;
        background: rgba(8, 13, 24, 0.9);
      }
      #saybar.speaking button { border-color: var(--accent); }
      body:not(.rail-visible) #saybar { left: 0.6rem; }
      #stageHint {
        position: fixed;
        top: 6.1rem;
        left: calc(var(--rail) + 0.6rem);
        z-index: 4;
        color: var(--dim);
        font-size: 0.72rem;
        transition: left 0.22s ease, opacity 0.15s ease;
        pointer-events: none;
      }
      #stageHint.used { opacity: 0; }
      body:not(.rail-visible) #stageHint { left: 0.6rem; }
      .srOnly {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      /* Element screenshots can include clipped DOM overlays, so mask all stage chrome. */
      body.measuring #focus,
      body.measuring #saybar,
      body.measuring #stageHint,
      body.measuring #hud { visibility: hidden; }

      /* Same reasoning as the focus chip: it sits over the stage, and the
         stage colour is now user-chosen. */
      #hud {
        position: fixed;
        right: 0.7rem;
        bottom: 0.7rem;
        z-index: 3;
        font-size: 0.7rem;
        color: #e6ecff;
        background: rgba(8, 13, 24, 0.72);
        padding: 0.15rem 0.45rem;
        border-radius: 0.3rem;
        font-variant-numeric: tabular-nums;
        text-align: right;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="rail-visible">
    <div id="stage"><canvas id="holo"></canvas></div>

    <button id="focus" type="button" title="Hide the rail and give the head the whole viewport (F)">
      focus
    </button>

    <form id="saybar" aria-label="Make the head speak">
      <label class="srOnly" for="say">Text to speak</label>
      <input id="say" name="say" type="text" maxlength="240" aria-label="Text to speak" autocomplete="off" placeholder="Say something…" />
      <button id="speak" type="submit" aria-pressed="false">Speak</button>
    </form>
    <div id="stageHint">Drag to orbit · wheel to frame · double-click to reset</div>

    <div id="rail">
      <div id="railHead">
        <h1>hologlyph studio</h1>
        <p>One surface over the library engine. Key looks live, the rest folded away.</p>
      </div>
      <div id="railBody"></div>
    </div>

    <div id="hud"></div>

    <script type="module">
      import { createEngine } from '../src/index.ts';

      const canvas = document.getElementById('holo');
      const stage = document.getElementById('stage');
      const engine = createEngine();
      window.__hologlyphEngine = engine;
      engine.on('error', (err) => console.error('[hologlyph]', err));
      await engine.mount(canvas, stage);
      engine.setScrollProgress(1);

const resizeStage = () => {
  const { width, height } = stage.getBoundingClientRect();
  engine.resize(Math.max(1, Math.round(width)), Math.max(1, Math.round(height)));
};
const stageResize = new ResizeObserver(resizeStage);
stageResize.observe(stage);
resizeStage();

      // ================================================================
      // Control schema.
      //
      // Three tiers, which is the whole point of this page:
      //   live    - what someone dressing the head actually reaches for
      //   advanced- real knobs, but per-region trims nobody needs day to day
      //   dev     - work in progress, and superseded features kept for reference
      //
      // `path` addresses HeadConfig. Everything is driven through
      // `engine.vfx.setHeadConfig`, so this page exercises the shipped surface
      // rather than a parallel one.
      // ================================================================
      // The engine's own live config, not `DEFAULT_HEAD_CONFIG`: that is a value
      // and `src/index.ts` re-exports only types, so it is not on the public
      // surface. `headConfig` is, and at boot it IS the defaults.
      const D = engine.vfx.headConfig;

      const SCHEMA = [
        {
          tier: 'live',
          groups: [
            {
              title: 'Framing',
              open: true,
              note: 'camera pose',
              controls: [{ kind: 'view' }],
            },
            {
              title: 'Backdrop',
              open: true,
              note: 'what you judge glass against',
              controls: [
                { kind: 'backdrop', label: 'page colour' },
                { kind: 'swatches', label: 'presets' },
              ],
            },
            {
              title: 'Look',
              open: true,
              controls: [
                { path: 'skin.glass.amount', label: 'glass', min: 0, max: 1, step: 0.01 },
                { path: 'skin.glass.tint', label: 'tint', kind: 'color' },
                { path: 'skin.opacity.base', label: 'presence', min: 0, max: 1, step: 0.005 },
                { path: 'eyes.irisColor', label: 'iris', kind: 'color' },
              ],
            },
            {
              title: 'Ink and tone',
              controls: [
                { path: 'skin.tone.balance', label: 'balance', min: 0, max: 1, step: 0.01 },
                { path: 'skin.tone.skinWarmth', label: 'warmth', min: 0, max: 1, step: 0.01 },
                { path: 'skin.tone.rim', label: 'rim', min: 0, max: 0.5, step: 0.005 },
              ],
            },
            {
              title: 'Glyphs',
              controls: [
                { path: 'skin.glyph.scale', label: 'size', min: 0.2, max: 2, step: 0.01 },
                { path: 'skin.glyph.sharpness', label: 'sharpness', min: 0.5, max: 12, step: 0.1 },
              ],
            },
            {
              title: 'Eyes',
              controls: [
                { path: 'eyes.scleraColor', label: 'sclera', kind: 'color' },
                { path: 'eyes.irisSize', label: 'iris size', min: 0.1, max: 0.9, step: 0.01 },
                { path: 'eyes.presence', label: 'presence', min: 0, max: 1, step: 0.01 },
              ],
            },
            { title: 'Expression', open: true, controls: [{ kind: 'expression' }] },
            { title: 'Motion', open: true, controls: [{ kind: 'motion' }] },
          ],
        },
        {
          tier: 'advanced',
          label: 'Fine tune',
          note: 'Per-region trims and shading internals. These were how the approved look was found; they are not day-to-day controls.',
          groups: [
            {
              title: 'Region opacity',
              note: 'was the whole panel once',
              controls: [
                { path: 'skin.opacity.lips', label: 'lips', min: 0, max: 1, step: 0.01 },
                { path: 'skin.opacity.nose', label: 'nose', min: 0, max: 1, step: 0.01 },
                { path: 'skin.opacity.jaw', label: 'jaw', min: 0, max: 1, step: 0.01 },
                { path: 'skin.opacity.orbit', label: 'orbit', min: 0, max: 1, step: 0.01 },
                { path: 'skin.opacity.brow', label: 'brow', min: 0, max: 1, step: 0.01 },
                { path: 'skin.opacity.socketMask', label: 'socket mask', min: 0, max: 1, step: 0.01 },
              ],
            },
            {
              title: 'Feature shading',
              controls: [
                { path: 'skin.shading.socketShadow', label: 'socket', min: 0, max: 1, step: 0.01 },
                { path: 'skin.shading.socketSize', label: 'socket size', min: 0, max: 3, step: 0.01 },
                { path: 'skin.shading.cavity', label: 'cavity', min: 0, max: 1, step: 0.01 },
                { path: 'skin.shading.lipDark', label: 'lip dark', min: 0, max: 1, step: 0.01 },
                { path: 'skin.shading.lipHue', label: 'lip hue', min: 0, max: 1, step: 0.01 },
                { path: 'skin.shading.lipGate', label: 'lip gate', min: 0, max: 4, step: 0.05 },
                { path: 'skin.shading.eyelid', label: 'eyelid', min: 0, max: 1, step: 0.01 },
                { path: 'skin.shading.brow', label: 'brow', min: 0, max: 1, step: 0.01 },
                { path: 'skin.shading.browGate', label: 'brow gate', min: 0, max: 4, step: 0.05 },
              ],
            },
            {
              title: 'Glass response',
              controls: [
                { path: 'skin.glass.fresnel', label: 'fresnel', min: 0, max: 2, step: 0.01 },
                { path: 'skin.glass.fresnelPower', label: 'fresnel pow', min: 0.5, max: 8, step: 0.05 },
                { path: 'skin.glass.specular', label: 'specular', min: 0, max: 2, step: 0.01 },
                { path: 'skin.glass.sheen', label: 'sheen', min: 0, max: 120, step: 1 },
                { path: 'skin.glass.refraction', label: 'refraction', min: 0, max: 0.2, step: 0.002 },
              ],
            },
            {
              title: 'Glyph grid',
              controls: [
                { path: 'skin.glyph.horizontalDensity', label: 'h density', min: 0.5, max: 6, step: 0.05 },
                { path: 'skin.glyph.verticalDensity', label: 'v density', min: 0.5, max: 6, step: 0.05 },
                { path: 'skin.tone.amount', label: 'tone amount', min: 0, max: 1, step: 0.01 },
                { path: 'skin.tone.glowGain', label: 'glow gain', min: 0, max: 2, step: 0.01 },
              ],
            },
            {
              title: 'Eye internals',
              controls: [
                { path: 'eyes.density', label: 'density', min: 50, max: 600, step: 5 },
                { path: 'eyes.scleraGlow', label: 'sclera glow', min: 0, max: 2, step: 0.01 },
                { path: 'eyes.irisGlow', label: 'iris glow', min: 0, max: 4, step: 0.01 },
                { path: 'eyes.pupil', label: 'pupil', min: 0, max: 0.8, step: 0.01 },
                { path: 'skin.backdrop.adapt', label: 'backdrop adapt', min: 0, max: 1, step: 0.01 },
              ],
            },
          ],
        },
        {
          tier: 'dev',
          label: 'Developer, work in progress',
          note: 'The melt is the live liquid direction (dec.liquid-glass-melt) and needs judging. Everything under Superseded was ruled against on 2026-07-27 and is kept only so it can be compared against.',
          groups: [
            {
              title: 'Melt',
              open: true,
              note: 'WIP',
              controls: [
                { path: 'melt.amount', label: 'amount', min: 0, max: 1, step: 0.005 },
                { path: 'melt.spread', label: 'spread', min: 0, max: 4, step: 0.05 },
                { path: 'melt.floor', label: 'floor', min: 0, max: 0.4, step: 0.005 },
                { path: 'melt.lag', label: 'lag', min: 0, max: 2, step: 0.01 },
                { kind: 'melt-actions' },
              ],
            },
          ],
        },
        {
          tier: 'legacy',
          label: 'Archive',
          note: 'Cut or missed on 2026-07-27 (src.owner-look-2026-07-27). All gated off. Nothing here is a direction; they are here to A/B against the melt.',
          groups: [
            {
              title: 'Pool',
              note: 'CUT',
              controls: [{ path: 'pool.amount', label: 'amount', min: 0, max: 1, step: 0.01 }],
            },
            {
              title: 'Modal fluid',
              note: 'MISSED',
              controls: [
                { path: 'fluid.amount', label: 'amount', min: 0, max: 1, step: 0.01 },
                { path: 'stage.amount', label: 'stage', min: 0, max: 1, step: 0.01 },
              ],
            },
            {
              title: 'Backdrop rungs',
              note: 'lens preferred',
              controls: [
                { path: 'lens.amount', label: 'lens', min: 0, max: 1, step: 0.01 },
                { path: 'compositor.amount', label: 'frost', min: 0, max: 1, step: 0.01 },
              ],
            },
            {
              title: 'Interior glyphs',
              note: 'experimental',
              controls: [
                { path: 'interior.count', label: 'count', min: 0, max: 400, step: 1 },
                { path: 'interior.drift', label: 'drift', min: 0, max: 0.05, step: 0.001 },
              ],
            },
          ],
        },
        {
          // The 2026-07-27 rulings and the melt's status, folded in from what
          // used to be a separate outcomes page. One environment: a ruling you
          // have to open a second URL to read is a ruling nobody reads.
          tier: 'notes',
          label: 'Rulings and notes',
          groups: [
            {
              title: 'The look session, 2026-07-27',
              controls: [
                {
                  kind: 'note',
                  text: 'Six gated features walked in one sitting, most ruled against. Pool: CUT, "thats not at all what i was getting at". Modal fluid: MISSED, "its just like a gravity effect? and it all bulges". Stage participants: MISSED, "a bit weird, and doesnt hit the mark". Compositor frost: rejected on the shape of its clip, not its content. Interior glyphs: kept, experimental, default off. Of the two backdrop rungs the lens wins. Verbatim in src.owner-look-2026-07-27.',
                },
              ],
            },
            {
              title: 'Glass is the default now',
              open: true,
              controls: [
                {
                  kind: 'note',
                  text: 'Approved, and no longer a lab feature: skin.glass.amount ships at 1 and this page is the one environment it is shown in. Above 0 it is a live uniform you can dial freely. At exactly 0 it is a mode switch, because applyGlassLayering drops the interior wall, flips transparency across the layered set and recompiles. So treat 0 as off rather than as the bottom of the dial.',
                },
              ],
            },
            {
              title: 'The melt is active development',
              open: true,
              controls: [
                {
                  kind: 'note',
                  text: 'Promoted 2026-07-28 from experimental spike to the approved liquid direction (dec.liquid-glass-melt). Active development, not ready. A vertex melt on the real bust rather than a particle field: neither the puddle morph nor the squeeze changes topology, so the rig, the authored visemes, the glyphs and the glass all survive and it runs on WebGL2. The escalation criterion did not fire, and at full melt the rim is a smooth ellipse with no facial features on it. As of 2026-07-31, the eyeballs, mouth cavity and eye trim melt with the shell. The puddle still has no thickness at exactly 1. The second half of the ask, squeezing between page elements, is not built.',
                },
              ],
            },
            {
              title: 'Known gaps in this page',
              controls: [
                {
                  kind: 'note',
                  text: 'Camera framing is available on the public Engine view pose: orbit, height, distance, look-at and field of view persist through resize and avatar replacement. The studio uses Engine.setView and never accesses renderer internals.',
                },
              ],
            },
          ],
        },
      ];

      // ================================================================
      // Plumbing
      // ================================================================
      const at = (obj, path) => path.split('.').reduce((o, k) => o?.[k], obj);

      /** A single-key-deep patch object for `setHeadConfig`, from a dotted path. */
      function patch(path, value) {
        const keys = path.split('.');
        const out = {};
        let node = out;
        for (let i = 0; i < keys.length - 1; i++) node = node[keys[i]] = {};
        node[keys[keys.length - 1]] = value;
        return out;
      }

      const push = (path, value) => engine.vfx.setHeadConfig(patch(path, value));

      const el = (tag, props = {}, kids = []) => {
        const node = Object.assign(document.createElement(tag), props);
        for (const kid of kids) node.append(kid);
        return node;
      };

      const railBody = document.getElementById('railBody');
      const rangeInputs = new Map();

      function addRange(host, spec) {
        const current = at(engine.vfx.headConfig, spec.path) ?? 0;
        const input = el('input', {
          type: 'range',
          min: String(spec.min),
          max: String(spec.max),
          step: String(spec.step),
          value: String(current),
        });
        const out = el('output', { textContent: fmt(current, spec.step) });
        const label = el('label', { textContent: spec.label });
        input.addEventListener('input', () => {
          const v = Number(input.value);
          out.textContent = fmt(v, spec.step);
          push(spec.path, v);
        });
        rangeInputs.set(spec.path, { input, out, spec });
        host.append(el('div', { className: 'row' }, [label, input, out]));
      }

      const fmt = (v, step) => v.toFixed(step >= 1 ? 0 : step >= 0.05 ? 2 : 3);

      function addColor(host, spec) {
        const input = el('input', {
          type: 'color',
          value: at(engine.vfx.headConfig, spec.path) ?? '#ffffff',
        });
        input.addEventListener('input', () => push(spec.path, input.value));
        host.append(el('div', { className: 'row' }, [
          el('label', { textContent: spec.label }), input, el('output'),
        ]));
      }

      const VIEW_SPECS = [
        { path: 'yaw', label: 'orbit', min: -Math.PI, max: Math.PI, step: 0.01 },
        { path: 'height', label: 'height', min: -2, max: 3, step: 0.01 },
        { path: 'distance', label: 'distance', min: 0.6, max: 12, step: 0.01 },
        { path: 'lookAt', label: 'look-at', min: -2, max: 3, step: 0.01 },
        { path: 'fov', label: 'field of view', min: 10, max: 80, step: 1 },
      ];
      const viewInputs = new Map();
      function syncViewInputs() {
        for (const [path, entry] of viewInputs) {
          const value = engine.view[path];
          entry.input.value = String(value);
          entry.out.textContent = fmt(value, entry.spec.step);
        }
      }
      function addView(host) {
        for (const spec of VIEW_SPECS) {
          const input = el('input', {
            type: 'range', min: String(spec.min), max: String(spec.max),
            step: String(spec.step), value: String(engine.view[spec.path]),
          });
          const out = el('output', { textContent: fmt(engine.view[spec.path], spec.step) });
          input.addEventListener('input', () => {
            engine.setView({ [spec.path]: Number(input.value) });
            syncViewInputs();
          });
          viewInputs.set(spec.path, { input, out, spec });
          host.append(el('div', { className: 'row' }, [el('label', { textContent: spec.label }), input, out]));
        }
      }

      // `auto` off so the push sticks.
      function setBackdrop(color) {
        document.body.style.background = color;
        engine.vfx.setHeadConfig({ skin: { backdrop: { color, auto: false } } });
      }

      const BACKDROPS = ['#05070d', '#101826', '#1b2430', '#2b1d33', '#0e2a2a', '#f4f1ea', '#ffffff'];

      function addBackdrop(host, spec) {
        const input = el('input', { type: 'color', value: D.skin.backdrop.color });
        input.addEventListener('input', () => setBackdrop(input.value));
        host.append(el('div', { className: 'row' }, [el('label', { textContent: spec.label }), input, el('output')]));
        host.dataset.backdropInput = '1';
        host._backdropInput = input;
      }

      function addSwatches(host) {
        const names = {
          '#05070d': 'midnight', '#101826': 'navy', '#1b2430': 'slate',
          '#2b1d33': 'plum', '#0e2a2a': 'teal', '#f4f1ea': 'cream', '#ffffff': 'white',
        };
        const wrap = el('div', { className: 'swatches' });
        const buttons = [];
        for (const color of BACKDROPS) {
          const b = el('button', { type: 'button', title: names[color], ariaLabel: `${names[color]} backdrop` });
          b.style.background = color;
          b.addEventListener('click', () => {
            setBackdrop(color);
            const input = host._backdropInput;
            if (input) input.value = color;
            for (const button of buttons) button.classList.toggle('active', button === b);
          });
          if (color === D.skin.backdrop.color) b.classList.add('active');
          buttons.push(b);
          wrap.append(b);
        }
        host.append(wrap);
      }

// Camera framing is driven exclusively through the public Engine view pose.
// This deployable page never accesses renderer internals.

      // --- motion ------------------------------------------------------
      let frozen = false;
      function addMotion(host) {
        const mk = (label, title, onChange) => {
          const cb = el('input', { type: 'checkbox' });
          cb.addEventListener('change', () => onChange(cb.checked));
          const row = el('div', { className: 'row check' }, [cb, el('label', { textContent: label, title })]);
          host.append(row);
          return cb;
        };
        mk('freeze head motion', 'Freeze the rig for a still capture', (on) => {
          frozen = on;
          engine.setMotionFrozen(on);
        });
        mk('reduce motion', 'Damps nods, disables saccades, shortens ramps', (on) => engine.vfx.setReducedMotion(on));
      }

      function addExpression(host) {
        const wrap = el('div', { className: 'btns' });
        const buttons = [];
        for (const expression of ['neutral', 'friendly', 'thinking', 'happy', 'listening']) {
          const button = el('button', { type: 'button', textContent: expression });
          button.addEventListener('click', () => {
            engine.setEmotion(expression);
            for (const item of buttons) item.classList.toggle('on', item === button);
          });
          if (expression === 'neutral') button.classList.add('on');
          buttons.push(button);
          wrap.append(button);
        }
        host.append(wrap);
      }

      // --- melt actions ------------------------------------------------
      const CYCLE_MS = 6000;
      let cycleStart = 0;
      function setMelt(v) {
        const entry = rangeInputs.get('melt.amount');
        if (!entry) return;
        entry.input.value = String(v);
        entry.out.textContent = fmt(v, entry.spec.step);
        push('melt.amount', v);
      }

      function addMeltActions(host) {
        const btns = el('div', { className: 'btns' });
        const head = el('button', { type: 'button', textContent: 'head' });
        const puddle = el('button', { type: 'button', textContent: 'puddle' });
        const cycle = el('button', { type: 'button', textContent: 'cycle' });
        head.addEventListener('click', () => { cycleStart = 0; setMelt(0); });
        puddle.addEventListener('click', () => { cycleStart = 0; setMelt(1); });
        cycle.addEventListener('click', () => {
          // A hand-dragged slider does not show a morph. The sweep does.
          cycleStart = performance.now();
          cycle.classList.add('on');
        });
        host.append(btns);
        btns.append(head, puddle, cycle);
        host.append(
          el('p', {
            className: 'tierNote',
            textContent:
              'Known: internals melt with the shell as of 2026-07-31. The puddle still has no thickness at exactly 1, so judge the shell rather than a solid volume.',
          }),
        );
        return cycle;
      }
      let cycleBtn = null;

      // --- build -------------------------------------------------------
      for (const tier of SCHEMA) {
        let host = railBody;
        if (tier.tier !== 'live') {
          const body = el('div', { className: 'body' });
          const summary = el('summary', { textContent: tier.label });
          const details = el('details', { className: `tier ${tier.tier}` }, [summary, body]);
          railBody.append(details);
          if (tier.note) body.append(el('p', { className: 'tierNote', textContent: tier.note }));
          host = body;
        }

        for (const group of tier.groups) {
          const body = el('div', { className: 'body' });
          const summary = el('summary');
          summary.append(document.createTextNode(group.title));
          if (group.note) summary.append(el('span', { className: 'note', textContent: group.note }));
          const details = el('details', { className: 'group' }, [summary, body]);
          if (group.open) details.open = true;
          host.append(details);

          for (const c of group.controls) {
            if (c.kind === 'color') addColor(body, c);
            else if (c.kind === 'backdrop') addBackdrop(body, c);
            else if (c.kind === 'swatches') addSwatches(body);
            else if (c.kind === 'motion') addMotion(body);
            else if (c.kind === 'expression') addExpression(body);
            else if (c.kind === 'view') addView(body);
            else if (c.kind === 'melt-actions') cycleBtn = addMeltActions(body);
            else if (c.kind === 'note') body.append(el('p', { className: 'noteText', textContent: c.text }));
            else addRange(body, c);
          }
        }
      }

      // --- speech ------------------------------------------------------
      const saybar = document.getElementById('saybar');
      const say = document.getElementById('say');
      const speak = document.getElementById('speak');
      let speechGeneration = 0;
      let speaking = false;
      function renderSpeechState() {
        speak.textContent = speaking ? 'Stop' : 'Speak';
        speak.setAttribute('aria-pressed', String(speaking));
        saybar.classList.toggle('speaking', speaking);
      }
      async function beginSpeech() {
        const generation = ++speechGeneration;
        if (speaking || engine.speech.speaking) {
          engine.speech.cancel();
          speaking = false;
          renderSpeechState();
          return;
        }
        const text = say.value.trim() || 'Hologlyph is a text-skinned talking head.';
        speaking = true;
        renderSpeechState();
        try {
          await engine.speak(text);
        } finally {
          if (generation === speechGeneration) {
            speaking = false;
            renderSpeechState();
          }
        }
      }
      saybar.addEventListener('submit', (event) => { event.preventDefault(); void beginSpeech(); });
      engine.on('speechstart', () => { speaking = true; renderSpeechState(); });
      engine.on('speechend', () => { speaking = false; renderSpeechState(); });

      // --- camera and gaze ---------------------------------------------
      const DEFAULT_VIEW = { yaw: 0, height: 0.05, distance: 2.4, lookAt: 0, fov: 35 };
      const stageHint = document.getElementById('stageHint');
      let dragPointer = null;
      let dragStart = null;
      let gazeFrame = 0;
      let gazeTarget = null;
      const markGesture = () => stageHint.classList.add('used');
      function setView(patch) {
        engine.setView(patch);
        syncViewInputs();
      }
      stage.addEventListener('pointerdown', (event) => {
        if (event.button !== 0 || event.target !== canvas) return;
        dragPointer = event.pointerId;
        dragStart = { x: event.clientX, y: event.clientY, view: engine.view, moved: false };
        stage.setPointerCapture(event.pointerId);
        engine.motion.clearGazeFollow();
      });
      stage.addEventListener('pointermove', (event) => {
        if (event.pointerId === dragPointer && dragStart) {
          const dx = event.clientX - dragStart.x;
          const dy = event.clientY - dragStart.y;
          dragStart.moved ||= Math.abs(dx) + Math.abs(dy) > 3;
          if (dragStart.moved) markGesture();
          setView({ yaw: dragStart.view.yaw + dx * 0.006, height: dragStart.view.height - dy * 0.006 });
          return;
        }
        const rect = stage.getBoundingClientRect();
        gazeTarget = {
          x: ((event.clientX - rect.left) / rect.width) * 2 - 1,
          y: -((event.clientY - rect.top) / rect.height) * 2 + 1,
        };
        if (!gazeFrame) gazeFrame = requestAnimationFrame(() => {
          gazeFrame = 0;
          if (gazeTarget) engine.motion.setGazeTarget(gazeTarget.x, gazeTarget.y);
        });
      });
      const endCameraDrag = (event) => {
        if (event.pointerId !== dragPointer) return;
        if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
        dragPointer = null;
        dragStart = null;
      };
      stage.addEventListener('pointerup', endCameraDrag);
      stage.addEventListener('pointercancel', endCameraDrag);
      stage.addEventListener('lostpointercapture', endCameraDrag);
      stage.addEventListener('pointerleave', () => {
        gazeTarget = null;
        engine.motion.clearGazeFollow();
      });
      stage.addEventListener('wheel', (event) => {
        if (event.target !== canvas) return;
        event.preventDefault();
        markGesture();
        setView({ distance: engine.view.distance + event.deltaY * 0.0015 });
      }, { passive: false });
      stage.addEventListener('dblclick', (event) => {
        if (event.target !== canvas && event.target !== stage) return;
        setView(DEFAULT_VIEW);
        stageHint.classList.remove('used');
      });

      // One class has one meaning at every width: whether the rail is visible.
      const focusBtn = document.getElementById('focus');
      const narrowRail = matchMedia('(max-width: 760px)');
      function renderRailControl() {
        const visible = document.body.classList.contains('rail-visible');
        focusBtn.textContent = narrowRail.matches
          ? (visible ? 'close controls' : 'controls')
          : (visible ? 'focus' : 'controls');
        focusBtn.classList.toggle('on', !visible);
      }
      function setRailVisible(visible) {
        document.body.classList.toggle('rail-visible', visible);
        renderRailControl();
      }
      // A fixed rail leaves too little room for the bust below this width.
      setRailVisible(!narrowRail.matches);
      document.body.classList.add('rail-ready');
      narrowRail.addEventListener('change', renderRailControl);
      focusBtn.addEventListener('click', () => setRailVisible(!document.body.classList.contains('rail-visible')));
      window.addEventListener('keydown', (e) => {
        if (e.key === 'f' && !/^(INPUT|TEXTAREA)$/.test(e.target?.tagName ?? '')) {
          setRailVisible(!document.body.classList.contains('rail-visible'));
        }
      });

      // --- hud ---------------------------------------------------------
      const hud = document.getElementById('hud');
      let last = 0;
      const frames = [];
      function tick(now) {
        if (cycleStart) {
          const t = (now - cycleStart) / CYCLE_MS;
          if (t >= 1) {
            cycleStart = 0;
            cycleBtn?.classList.remove('on');
            setMelt(0);
          } else {
            setMelt(Math.round((1 - Math.abs(1 - t * 2)) * 200) / 200);
          }
        }
        if (last) {
          frames.push(now - last);
          if (frames.length > 120) frames.shift();
        }
        last = now;
        if (frames.length === 120 && now % 500 < 20) {
          const mean = frames.reduce((a, b) => a + b, 0) / frames.length;
          hud.textContent = `${mean.toFixed(1)} ms  ${(1000 / mean).toFixed(0)} fps${frozen ? '  frozen' : ''}`;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
